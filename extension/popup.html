<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui; background: #09090b; color: #e4e4e7; width: 320px; padding: 16px; margin: 0; }
    h1 { font-size: 15px; margin: 0 0 12px; color: #f43f5e; }
    label { font-size: 12px; color: #a1a1aa; display: block; margin: 8px 0 4px; }
    input { width: 100%; box-sizing: border-box; background: #27272a; border: 1px solid #3f3f46; color: #fff; border-radius: 8px; padding: 8px; font-size: 12px; }
    button { margin-top: 12px; width: 100%; background: #e11d48; border: 0; color: #fff; border-radius: 8px; padding: 8px; font-size: 13px; cursor: pointer; }
    .ok { color: #34d399; font-size: 12px; margin-top: 8px; }
    p.hint { font-size: 11px; color: #71717a; }
  </style>
</head>
<body>
  <h1>MomentumOS Companion</h1>
  <label>MomentumOS-URL</label>
  <input id="baseUrl" placeholder="https://momentumos-hq.vercel.app" />
  <label>Extension-Token (aus Einstellungen)</label>
  <input id="token" type="password" placeholder="mox_…" />
  <button id="save">Speichern</button>
  <div id="status"></div>
  <p class="hint">Auf Tinder/Bumble/Boo/WhatsApp-Web/Instagram erscheint unten rechts der MomentumOS-Button.</p>
  <script src="popup.js"></script>
</body>
</html>
