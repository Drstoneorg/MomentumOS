# Supabase-Keepalive: Free-Tier pausiert Projekte nach 7 Tagen ohne API-Aktivität.
# Pingt täglich /api/keepalive der App — die Route macht einen anon-Query gegen
# Supabase-REST (zählt als Aktivität), unabhängig von den Vercel-Crons.
# Braucht keine Secrets. Roter Lauf = GitHub-Mail = Frühwarnung.
# Hinweis: GitHub deaktiviert Schedules nach 60 Tagen ohne Repo-Aktivität;
# bei Deaktivierungs-Mail einfach manuell re-enablen.
name: Supabase Keepalive

on:
  schedule:
    - cron: "17 5 * * *" # täglich ~05:17 UTC (GitHub-Cron kann sich verzögern)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/keepalive
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            "https://momentumos-hq.vercel.app/api/keepalive")
          echo "HTTP $code"
          cat /tmp/body
          if [ "$code" != "200" ]; then
            echo "Keepalive fehlgeschlagen"
            exit 1
          fi
